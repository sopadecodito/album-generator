<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canción del día</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
  <script>
    
    window.SPOTIFY_TOKEN_ENDPOINT = "/api/spotify-token";
  </script>
</head>
<body>
  <main class="page">
    <!-- ¿Mi amor que buscas en el codigo? ¿Un mensaje? -->
    <!-- Pues aqui está, te amo muchisimo -->

    <!-- No es una amenaza, ni quiero que te sientas culpable -->
    <!-- Solo quiero que sepas que estoy aquí -->
    <!-- No espero por presion, sino por amor -->
    <!-- Te esperaré esta vida y las que sean necesarias -->
    <!-- hasta que decidas que soy con quien quieres estar -->

    <section class="toolbar shell">
      <input id="spotifyUrl" class="input" placeholder="Pega aquí tu link de Spotify (track / album / playlist)" />
      <div class="actions">
        <button id="btnGen" class="btn">Generar</button>
        <button id="btnExport" class="btn ghost" title="Exportar JSON para today.json">Exportar JSON</button>
      </div>
      <label class="hint">Sin token: oEmbed (título, artista, portada, player). Con token: tracklist y duración total.</label>
    </section>

    <!-- Vista -->
    <section id="result" class="shell album hidden">
      <header class="album-head">
        <img id="cover" class="cover" alt="Portada" />
        <div class="meta">
          <h1 id="title">—</h1>
          <a id="artistLink" target="_blank" rel="noopener" class="artist">—</a>
          <div class="chips">
            <span id="date" class="chip"></span>
            <span id="duration" class="chip"></span>
          </div>
          <div class="palette" id="palette"></div>
        </div>
      </header>

      <section class="player glass">
        <div id="embedWrap" class="embed-wrap">
          <div id="embedContainer"></div>
          <div class="embed-glass" aria-hidden="true"></div>
        </div>
      </section>

      <section class="content">
        <article class="card prose">
          <h2>Letra</h2>
          <p id="lyric" class="lyric"></p>
        </article>

        <article class="card prose">
          <h2>Mi mensaje</h2>
          <p id="note"></p>
        </article>

        <article class="card prose">
          <h2 id="bibleRef">Pasaje</h2>
          <p id="bibleText"></p>
        </article>

<aside class="card tracks">
  <h3>Hoy no hay video</h3>
  <ol id="tracks"></ol>
  <small id="totalDur" class="muted"></small>

  <!-- A veces habrá tiktoks a veces no, te amo -->
 <!-- <div id="videoBox" class="hidden"></div> -->
</aside>

      </section>
    </section>
  </main>

<script src="app.js?v=8" defer></script>
<!--La veladora se arrastra mi amor-->
<div class="darkness" aria-hidden="true"></div>
 <div id="hint" class="hint-msg">Arrastra la vela para iluminar</div>
<div class="candle" aria-label="Veladora, arrastra para iluminar">
  <svg viewBox="0 0 36 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- flama -->
    <path class="flame" d="M18 6 C14 12, 22 14, 18 22 C24 20, 26 14, 18 6Z" fill="#FFC24D"/>
    <path class="flame" d="M18 10 C16 13, 20 14, 18 18 C21 17, 22 14, 18 10Z" fill="#FF8A00" opacity=".7"/>
    <!-- pabilo -->
    <rect x="17" y="22" width="2" height="6" rx="1" fill="#3B3B3B"/>
    <!-- vela -->
    <rect x="10" y="28" width="16" height="26" rx="6" fill="#F2F2F5"/>
    <rect x="10" y="28" width="16" height="26" rx="6" fill="#fcedc0" opacity=".6"/>
    <!-- platito -->
    <rect x="6" y="56" width="24" height="4" rx="2" fill="#A7A9B0" opacity=".9"/>
  </svg>
</div>

<script src="candle.js" defer></script>
</body>
</html>
